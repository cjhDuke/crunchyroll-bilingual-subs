<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <strong>Crunchyroll 双语字幕</strong>
    <label class="switch" title="总开关">
      <input id="enabled" type="checkbox">
      <span></span>
    </label>
  </header>
  <div id="status" class="status">读取中…</div>
  <div id="progress" class="progress" hidden><div id="bar"></div></div>
  <div id="detail" class="detail"></div>
  <label class="row">字幕显示
    <select id="displayMode">
      <option value="bilingual">双语</option>
      <option value="translation">仅译文</option>
      <option value="original">仅原文</option>
    </select>
  </label>
  <fieldset id="offsetControls" class="offset-controls" disabled>
    <legend>本集字幕时间</legend>
    <label class="row" for="offsetSeconds">偏移秒数
      <span><input id="offsetSeconds" type="number" min="-600" max="600" step="0.5" value="0" aria-describedby="offsetHint"> 秒</span>
    </label>
    <input id="offsetSlider" type="range" min="-600" max="600" step="0.5" value="0" aria-label="本集字幕时间偏移" aria-describedby="offsetHint">
    <div class="buttons offset-buttons">
      <button id="offsetEarlier" type="button">提前 0.5 秒</button>
      <button id="offsetLater" type="button">延后 0.5 秒</button>
      <button id="offsetReset" type="button">重置</button>
    </div>
    <p id="offsetHint" class="muted">正数延后，负数提前；范围 ±600 秒，仅保存到本集。</p>
    <p id="offsetFeedback" class="muted" role="status" aria-live="polite"></p>
  </fieldset>
  <div class="buttons">
    <button id="retryGoogle" type="button" disabled>重翻谷歌部分</button>
    <button id="retryAll" type="button" disabled>全部重翻</button>
  </div>
  <footer>
    <span id="model" class="muted"></span>
    <a href="#" id="openOptions">设置</a>
  </footer>
  <script src="../shared/settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
