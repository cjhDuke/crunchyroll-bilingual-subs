<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Crunchyroll 双语字幕 · 设置</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main>
    <h1>Crunchyroll 双语字幕</h1>

    <section>
      <h2>翻译模型</h2>
      <label>供应商
        <select id="provider"></select>
      </label>
      <label>Base URL
        <input id="baseUrl" type="url" placeholder="https://api.deepseek.com" spellcheck="false">
        <small>请求地址为 Base URL + <code>/chat/completions</code>（OpenAI 兼容格式）。</small>
      </label>
      <label>API Key
        <span class="row">
          <input id="apiKey" type="password" autocomplete="off" spellcheck="false">
          <button type="button" id="toggleKey" class="ghost">显示</button>
        </span>
        <small>只保存在本机，只会发送到上面的 Base URL。</small>
      </label>
      <label>模型
        <input id="model" type="text" placeholder="deepseek-flash" spellcheck="false">
      </label>
      <label>额外请求参数（JSON）
        <textarea id="extraParams" rows="3" spellcheck="false"></textarea>
        <small>会合并进请求体。DeepSeek 默认用 <code>{"thinking": {"type": "disabled"}}</code> 关闭思考模式。</small>
      </label>
      <div class="row">
        <button type="button" id="test">测试连接</button>
        <span id="testResult" class="hint"></span>
      </div>
    </section>

    <section>
      <h2>翻译与显示</h2>
      <label>目标语言
        <select id="targetLang"></select>
      </label>
      <label>显示模式
        <select id="displayMode">
          <option value="bilingual">双语对照</option>
          <option value="translation">仅译文</option>
          <option value="original">仅原文</option>
        </select>
      </label>
      <label>译文位置
        <select id="translationPosition">
          <option value="top">译文在上，原文在下</option>
          <option value="bottom">原文在上，译文在下</option>
        </select>
      </label>
      <label>译文字号缩放 <output id="fontScaleOut"></output>
        <input id="fontScale" type="range" min="0.6" max="1.6" step="0.05">
      </label>
    </section>

    <details>
      <summary>高级</summary>
      <label>每批句数 <input id="batchSize" type="number" min="5" max="100"></label>
      <label>并发请求数 <input id="concurrency" type="number" min="1" max="16"></label>
      <label>单批超时（毫秒） <input id="timeoutMs" type="number" min="5000" max="120000" step="1000"></label>
    </details>

    <div class="actions">
      <button type="button" id="save" class="primary">保存</button>
      <span id="saveResult" class="hint"></span>
    </div>

    <section>
      <h2>缓存</h2>
      <p id="cacheInfo" class="hint">统计中…</p>
      <button type="button" id="clearCache" class="danger">清空翻译缓存</button>
    </section>
  </main>
  <script src="../shared/settings.js"></script>
  <script src="../core/llm.js"></script>
  <script src="../core/translator.js"></script>
  <script src="options.js"></script>
</body>
</html>
